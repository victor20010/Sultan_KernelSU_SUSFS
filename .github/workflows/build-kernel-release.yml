name: Build and Release Sultan Kernels

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: 'Kernel Source'
        required: true
        default: 'https://github.com/aosp-gs-유/kernel_manifest-gs201'
        type: string
      kernel_source_branch:
        description: 'Kernel Source Branch'
        required: true
        default: '15.0.0'
        type: string
      anykernel_source:
        description: 'Anykernel Source'
        required: true
        default: 'https://github.com/aosp-gs-유/AnyKernel3'
        type: string
      anykernel_source_branch:
        description: 'Anykernel Source Branch'
        required: true
        default: '15.0.0-sultan-gs201'
        type: string
      susfs_source:
        description: 'SUSFS Source'
        required: true
        default: 'https://github.com/tiann/KernelSU'
        type: string
      susfs_branch:
        description: 'SUSFS Branch'
        required: true
        default: 'gki-android14-6.1'
        type: string
      kernel_name:
        description: 'Kernel Name'
        required: true
        default: 'Sultan'
        type: string
      devices:
        description: 'Device codenames (comma-separated)'
        required: true
        default: 'oriole,raven,bluejay,panther,cheetah'
        type: string
      release:
        description: 'Create Release'
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build Kernel for ${{ matrix.device }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: ${{ fromJson(format('["{0}"]', join(split(github.event.inputs.devices, ','), '","'))) }}
    container:
      image: zackptg5/docker-build-aosp:latest
      options: --user 1001

    steps:
    - name: Set up the environment
      run: |
        set -e
        sudo chown -R 1001:1001 /github/home
        sudo chown -R 1001:1001 /github/workspace
        git config --global user.name "Zackptg5"
        git config --global user.email "zackptg5@gmail.com"
        df -h

    - name: Clone kernel source
      run: |
        set -e
        git clone ${{ github.event.inputs.kernel_source }} -b ${{ github.event.inputs.kernel_source_branch }} --depth=1 kernel
        cd kernel
        git submodule init
        git submodule update

    - name: Clone AnyKernel3 and SUSFS
      run: |
        set -e
        cd kernel
        echo "Using branch for AnyKernel3: ${{ github.event.inputs.anykernel_source_branch }}"
        echo "Using branch for SUSFS: ${{ github.event.inputs.susfs_branch }}"
        git clone ${{ github.event.inputs.anykernel_source }} -b ${{ github.event.inputs.anykernel_source_branch }} --depth=1 AnyKernel3
        git clone ${{ github.event.inputs.susfs_source }} -b ${{ github.event.inputs.susfs_branch }} --depth=1 susfs4ksu

    - name: Build the kernel
      run: |
        set -e
        cd kernel
        export KERNEL_NAME="${{ github.event.inputs.kernel_name }}"
        export DEVICE="${{ matrix.device }}"
        export KERNEL_SOURCE_BRANCH="${{ github.event.inputs.kernel_source_branch }}"
        source build.sh

    - name: Create release
      if: ${{ github.event.inputs.release }}
      uses: ncipollo/release-action@v1
      with:
        artifacts: "kernel/AnyKernel3/*.zip"
        tag: ${{ github.event.inputs.kernel_name }}-${{ matrix.device }}-${{ github.run_id }}
        name: ${{ github.event.inputs.kernel_name }} Kernel for ${{ matrix.device }}
        body: |
          Source branch: ${{ github.event.inputs.kernel_source_branch }}
          Kernel version: ${{ env.KERNEL_VERSION }}
          Date: $(date +"%Y-%m-%d %H:%M:%S")
        token: ${{ secrets.GITHUB_TOKEN }}
        prerelease: true
